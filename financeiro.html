<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Financeira - Folha Amarela</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* Design Tokens - Modo Claro (Padrão) */
        :root {
            --primary: #F59E0B;
            --primary-hover: #D97706;
            --dark: #1E293B;
            --light: #F8FAFC;
            --surface: #FFFFFF;
            --gray: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
            --danger: #EF4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            --input-bg: #F1F5F9;
        }

        /* Design Tokens - Modo Escuro */
        body.dark-mode {
            --primary: #FBBF24;
            --primary-hover: #F59E0B;
            --dark: #F1F5F9;
            --light: #0B0F17;
            --surface: #131C2E;
            --gray: #94A3B8;
            --border: #1E293B;
            --success: #34D399;
            --danger: #F87171;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            --input-bg: #1A263E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }
        body { background-color: var(--light); color: var(--dark); padding: 20px; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

        .container { width: 100%; max-width: 800px; background: var(--surface); padding: 28px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        
        .header-fin { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }

        .btn-theme-toggle { background: var(--input-bg); border: 1px solid var(--border); color: var(--dark); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        .btn-theme-toggle:hover { border-color: var(--primary); color: var(--primary); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--dark); }
        .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--input-bg); color: var(--dark); }
        .form-control:focus { border-color: var(--primary); }

        .btn-submit { background-color: var(--success); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 12px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-submit:hover { opacity: 0.9; }

        /* Tabela Moderna */
        .tabela-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 16px; margin-top: 16px; background: var(--surface); }
        .tabela-financeira { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .tabela-financeira th { background: var(--input-bg); color: var(--dark); padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--border); }
        .tabela-financeira td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--dark); }
        .tabela-financeira tr:last-child td { border-bottom: none; }
        .tabela-financeira tr:hover { background-color: var(--input-bg); }

        /* Modal de Autenticação na Rota */
        .modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--surface); padding: 32px; width: 90%; max-width: 360px; border-radius: 24px; text-align: center; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <!-- Modal de Autenticação na Rota -->
    <div id="modalSenha" class="modal">
        <div class="modal-content">
            <div style="font-size: 32px; color: var(--primary); margin-bottom: 12px;"><i class="fas fa-lock"></i></div>
            <h2 style="margin-bottom: 4px; font-size: 20px; color: var(--dark);">Rota Protegida</h2>
            <p style="font-size: 13px; color: var(--gray); margin-bottom: 20px;">Digite a senha do gestor</p>
            <input type="password" id="senhaRota" class="form-control" placeholder="Senha..." style="text-align: center; margin-bottom: 16px;">
            <button class="btn-submit" onclick="verificarSenha()" style="background: var(--dark); color: var(--surface);">Acessar Financeiro</button>
            <button onclick="window.location.href='index.html'" style="background: none; border: none; color: var(--gray); margin-top: 16px; cursor: pointer; font-size: 13px; text-decoration: underline;">Voltar ao site</button>
        </div>
    </div>

    <div class="container" id="conteudoFinanceiro" style="display: none;">
        <div class="header-fin">
            <div>
                <h2 style="font-size: 22px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-hand-holding-usd" style="color: var(--success);"></i> Central Financeira
                </h2>
                <p style="font-size: 13px; color: var(--gray); margin-top: 2px;">Gestão de assinaturas e faturamento VIP</p>
            </div>
            
            <div class="header-actions">
                <button class="btn-theme-toggle" id="btnTheme" onclick="toggleTheme()" title="Alternar Modo Escuro/Claro">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button onclick="window.location.href='index.html'" class="form-control" style="width: auto; background: var(--dark); color: var(--surface); border: none; cursor: pointer; font-weight: 700; font-size: 13px; padding: 10px 16px; border-radius: 12px;">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>

        <div style="background: var(--input-bg); border: 1px solid var(--border); padding: 24px; border-radius: 20px; margin-bottom: 28px;">
            <h3 style="font-size: 16px; margin-bottom: 16px; font-weight: 700;"><i class="fas fa-plus-circle" style="color: var(--primary);"></i> Lançar Novo Pagamento Pix</h3>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 200px;">
                    <label>Estabelecimento</label>
                    <select id="pagLocal" class="form-control"></select>
                </div>
                <div style="flex: 1; min-width: 120px;">
                    <label>Valor (R$)</label>
                    <input type="number" id="pagValor" class="form-control" placeholder="50.00">
                </div>
                <div style="flex: 1; min-width: 140px;">
                    <label>Data</label>
                    <input type="date" id="pagData" class="form-control">
                </div>
            </div>
            <label style="margin-top: 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; font-weight: 500;">
                <input type="checkbox" id="pagAutoVip" checked style="width: 18px; height: 18px; accent-color: var(--primary);"> 
                <b>Ativar destaque VIP automaticamente ao lançar</b>
            </label>
            <button class="btn-submit" onclick="registrarPagamento()">Registrar Pagamento na Nuvem</button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px;">Histórico de Receita</h3>
            <div style="font-size: 15px; font-weight: 700; color: var(--success); background: var(--input-bg); padding: 8px 14px; border-radius: 12px; border: 1px solid var(--border);">
                Total: R$ <span id="totalReceita">0,00</span>
            </div>
        </div>
        
        <div class="tabela-wrapper">
            <table class="tabela-financeira">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Estabelecimento</th>
                        <th>Valor</th>
                        <th style="text-align: center;">Excluir</th>
                    </tr>
                </thead>
                <tbody id="tabelaPagamentos">
                    <tr><td colspan="4" style="text-align:center; padding: 20px; color: var(--gray);">Carregando histórico...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Sincronização do Tema Claro/Escuro com o app principal
        function carregarTemaSalvo() {
            const temaSalvo = localStorage.getItem('folha_theme');
            if (temaSalvo === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('folha_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        carregarTemaSalvo();

        const firebaseConfig = {
            apiKey: "AIzaSyBxv7AWrRep8yRJyEK90nXgpEmO1zOfd8o",
            authDomain: "folha-amarela-digital.firebaseapp.com",
            projectId: "folha-amarela-digital",
            storageBucket: "folha-amarela-digital.firebasestorage.app",
            messagingSenderId: "377984429498",
            appId: "1:377984429498:web:0ec71abadab20a93420183"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let listaLocaisCache = [];
        let listaPagamentosCache = [];

        function verificarSenha() {
            let s = document.getElementById('senhaRota').value;
            if(s === '1234') {
                document.getElementById('modalSenha').style.display = 'none';
                document.getElementById('conteudoFinanceiro').style.display = 'block';
                iniciarDadosFinanceiros();
            } else {
                alert("Senha incorreta!");
            }
        }

        function iniciarDadosFinanceiros() {
            document.getElementById('pagData').valueAsDate = new Date();

            db.collection("locais").onSnapshot((snapshot) => {
                listaLocaisCache = [];
                snapshot.forEach((doc) => {
                    listaLocaisCache.push({ idDoc: doc.id, ...doc.data() });
                });
                popularSelectLocais();
            });

            db.collection("pagamentos").orderBy("data", "desc").onSnapshot((snapshot) => {
                listaPagamentosCache = [];
                snapshot.forEach((doc) => {
                    listaPagamentosCache.push({ idDoc: doc.id, ...doc.data() });
                });
                renderizarTabela();
            });
        }

        function popularSelectLocais() {
            let select = document.getElementById('pagLocal');
            select.innerHTML = '<option value="">Selecione...</option>';
            listaLocaisCache.filter(l => l.status !== 'pendente').sort((a,b) => a.nome.localeCompare(b.nome)).forEach(l => {
                select.innerHTML += `<option value="${l.idDoc}">${l.nome} (${l.cidade})</option>`;
            });
        }

        async function registrarPagamento() {
            let localId = document.getElementById('pagLocal').value;
            let valor = parseFloat(document.getElementById('pagValor').value);
            let data = document.getElementById('pagData').value;
            let autoVip = document.getElementById('pagAutoVip').checked;

            if(!localId || isNaN(valor) || !data) {
                return alert("Preencha todos os campos corretamente!");
            }

            let local = listaLocaisCache.find(l => l.idDoc === localId);
            let btn = document.querySelector(".btn-submit");
            btn.textContent = "Salvando..."; btn.disabled = true;

            await db.collection("pagamentos").add({
                localId: localId,
                nomeLocal: local.nome,
                valor: valor,
                data: data,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            if(autoVip && !local.is_featured) {
                await db.collection("locais").doc(localId).update({ is_featured: true });
            }

            document.getElementById('pagValor').value = '';
            btn.textContent = "Registrar Pagamento na Nuvem"; btn.disabled = false;
        }

        function renderizarTabela() {
            let tbody = document.getElementById('tabelaPagamentos');
            tbody.innerHTML = '';
            let total = 0;

            if(listaPagamentosCache.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--gray);">Nenhum pagamento registrado.</td></tr>';
                document.getElementById('totalReceita').textContent = '0,00';
                return;
            }

            listaPagamentosCache.forEach(p => {
                total += p.valor;
                let dataF = p.data.split('-').reverse().join('/');
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 500;">${dataF}</td>
                        <td style="font-weight: 700;">${p.nomeLocal}</td>
                        <td style="color: var(--success); font-weight: 700;">R$ ${p.valor.toFixed(2).replace('.',',')}</td>
                        <td style="text-align: center;">
                            <button onclick="excluirPagamento('${p.idDoc}')" style="background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('totalReceita').textContent = total.toFixed(2).replace('.',',');
        }

        async function excluirPagamento(id) {
            if(confirm("Deseja excluir este registro?")) {
                await db.collection("pagamentos").doc(id).delete();
            }
        }
    </script>
</body>
</html>
