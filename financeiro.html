<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Financeira - Folha Amarela</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #FFD700;
            --dark: #1A1A1A;
            --light: #F5F5F5;
            --gray: #666666;
            --success: #28a745;
            --danger: #dc3545;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); padding: 20px; }

        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-fin { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; }
        .btn-submit { background-color: var(--success); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }

        .tabela-financeira { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; margin-top: 15px; }
        .tabela-financeira th { background: var(--dark); color: white; padding: 12px 10px; }
        .tabela-financeira td { padding: 10px; border-bottom: 1px solid #eee; }
        .tabela-financeira tr:hover { background-color: #f9f9f9; }

        /* Modal de Senha Inicial */
        .modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; width: 90%; max-width: 350px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body>

    <!-- Modal de Autenticação na Rota -->
    <div id="modalSenha" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 5px;"><i class="fas fa-lock"></i> Rota Protegida</h2>
            <p style="font-size: 13px; color: var(--gray); margin-bottom: 20px;">Digite a senha do gestor</p>
            <input type="password" id="senhaRota" class="form-control" placeholder="Senha..." style="text-align: center; margin-bottom: 15px;">
            <button class="btn-submit" onclick="verificarSenha()" style="background: var(--dark);">Acessar Financeiro</button>
            <button onclick="window.location.href='index.html'" style="background: none; border: none; color: var(--gray); margin-top: 15px; cursor: pointer; text-decoration: underline;">Voltar ao site</button>
        </div>
    </div>

    <div class="container" id="conteudoFinanceiro" style="display: none;">
        <div class="header-fin">
            <div>
                <h2><i class="fas fa-hand-holding-usd" style="color: var(--success);"></i> Central Financeira</h2>
                <p style="font-size: 13px; color: var(--gray);">Gestão de assinaturas e faturamento VIP</p>
            </div>
            <button onclick="window.location.href='index.html'" class="form-control" style="width: auto; background: var(--dark); color: white; border: none; cursor: pointer; font-weight: bold;"><i class="fas fa-arrow-left"></i> Voltar ao App</button>
        </div>

        <div style="background: #fdfdfd; border: 1px solid #eee; padding: 20px; border-radius: 8px; margin-bottom: 25px;">
            <h3 style="font-size: 16px; margin-bottom: 15px;">Lançar Novo Pagamento Pix</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 200px;">
                    <label>Estabelecimento</label>
                    <select id="pagLocal" class="form-control"></select>
                </div>
                <div style="flex: 1; min-width: 120px;">
                    <label>Valor (R$)</label>
                    <input type="number" id="pagValor" class="form-control" placeholder="50.00">
                </div>
                <div style="flex: 1; min-width: 140px;">
                    <label>Data</label>
                    <input type="date" id="pagData" class="form-control">
                </div>
            </div>
            <label style="margin-top: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px;">
                <input type="checkbox" id="pagAutoVip" checked style="width: 16px; height: 16px;"> 
                <b>Ativar destaque VIP automaticamente ao lançar</b>
            </label>
            <button class="btn-submit" onclick="registrarPagamento()">Registrar Pagamento na Nuvem</button>
        </div>

        <h3 style="font-size: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            Histórico de Receita
            <span style="color: var(--success); font-size: 20px;">Total: R$ <span id="totalReceita">0,00</span></span>
        </h3>
        
        <div style="overflow-x: auto; border: 1px solid #ddd; border-radius: 8px;">
            <table class="tabela-financeira">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Estabelecimento</th>
                        <th>Valor</th>
                        <th style="text-align: center;">Excluir</th>
                    </tr>
                </thead>
                <tbody id="tabelaPagamentos">
                    <tr><td colspan="4" style="text-align:center;">Carregando histórico...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxv7AWrRep8yRJyEK90nXgpEmO1zOfd8o",
            authDomain: "folha-amarela-digital.firebaseapp.com",
            projectId: "folha-amarela-digital",
            storageBucket: "folha-amarela-digital.firebasestorage.app",
            messagingSenderId: "377984429498",
            appId: "1:377984429498:web:0ec71abadab20a93420183"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let listaLocaisCache = [];
        let listaPagamentosCache = [];

        function verificarSenha() {
            let s = document.getElementById('senhaRota').value;
            if(s === '1234') {
                document.getElementById('modalSenha').style.display = 'none';
                document.getElementById('conteudoFinanceiro').style.display = 'block';
                iniciarDadosFinanceiros();
            } else {
                alert("Senha incorreta!");
            }
        }

        function iniciarDadosFinanceiros() {
            document.getElementById('pagData').valueAsDate = new Date();

            // Puxa locais para o select
            db.collection("locais").onSnapshot((snapshot) => {
                listaLocaisCache = [];
                snapshot.forEach((doc) => {
                    listaLocaisCache.push({ idDoc: doc.id, ...doc.data() });
                });
                popularSelectLocais();
            });

            // Puxa pagamentos
            db.collection("pagamentos").orderBy("data", "desc").onSnapshot((snapshot) => {
                listaPagamentosCache = [];
                snapshot.forEach((doc) => {
                    listaPagamentosCache.push({ idDoc: doc.id, ...doc.data() });
                });
                renderizarTabela();
            });
        }

        function popularSelectLocais() {
            let select = document.getElementById('pagLocal');
            select.innerHTML = '<option value="">Selecione...</option>';
            listaLocaisCache.filter(l => l.status !== 'pendente').sort((a,b) => a.nome.localeCompare(b.nome)).forEach(l => {
                select.innerHTML += `<option value="${l.idDoc}">${l.nome} (${l.cidade})</option>`;
            });
        }

        async function registrarPagamento() {
            let localId = document.getElementById('pagLocal').value;
            let valor = parseFloat(document.getElementById('pagValor').value);
            let data = document.getElementById('pagData').value;
            let autoVip = document.getElementById('pagAutoVip').checked;

            if(!localId || isNaN(valor) || !data) {
                return alert("Preencha todos os campos corretamente!");
            }

            let local = listaLocaisCache.find(l => l.idDoc === localId);
            let btn = document.querySelector(".btn-submit");
            btn.textContent = "Salvando..."; btn.disabled = true;

            await db.collection("pagamentos").add({
                localId: localId,
                nomeLocal: local.nome,
                valor: valor,
                data: data,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            if(autoVip && !local.is_featured) {
                await db.collection("locais").doc(localId).update({ is_featured: true });
            }

            document.getElementById('pagValor').value = '';
            btn.textContent = "Registrar Pagamento na Nuvem"; btn.disabled = false;
        }

        function renderizarTabela() {
            let tbody = document.getElementById('tabelaPagamentos');
            tbody.innerHTML = '';
            let total = 0;

            if(listaPagamentosCache.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:15px; color:#666;">Nenhum pagamento registrado.</td></tr>';
                document.getElementById('totalReceita').textContent = '0,00';
                return;
            }

            listaPagamentosCache.forEach(p => {
                total += p.valor;
                let dataF = p.data.split('-').reverse().join('/');
                tbody.innerHTML += `
                    <tr>
                        <td>${dataF}</td>
                        <td style="font-weight: bold;">${p.nomeLocal}</td>
                        <td style="color: var(--success); font-weight: bold;">R$ ${p.valor.toFixed(2).replace('.',',')}</td>
                        <td style="text-align: center;">
                            <button onclick="excluirPagamento('${p.idDoc}')" style="background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('totalReceita').textContent = total.toFixed(2).replace('.',',');
        }

        async function excluirPagamento(id) {
            if(confirm("Deseja excluir este registro?")) {
                await db.collection("pagamentos").doc(id).delete();
            }
        }
    </script>
</body>
</html>
